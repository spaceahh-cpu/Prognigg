<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Sistema de Biogás – Energía Rural Colombia</title>

<!-- Three.js r134 – classic script tags, works on all browsers including iPad Safari -->
<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/renderers/CSS2DRenderer.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a1628;font-family:'Segoe UI',Arial,sans-serif;touch-action:none}
#app{width:100vw;height:100vh;position:relative}
canvas{display:block}
/* Label styling */
.lbl{
  color:#fff;font-size:11px;font-weight:700;
  background:rgba(0,0,0,.68);
  padding:3px 9px;border-radius:20px;
  border:1px solid rgba(255,255,255,.25);
  pointer-events:none;white-space:nowrap;
  text-shadow:0 1px 3px #000;letter-spacing:.4px
}
/* Title */
#hud{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);
  text-align:center;z-index:200;pointer-events:none;width:90vw
}
#hud h1{font-size:17px;color:#7EFF7E;text-shadow:0 0 14px rgba(126,255,126,.5);letter-spacing:.5px}
#hud p{font-size:11px;color:#aed6af;margin-top:3px}
/* Hint */
#hint{
  position:fixed;bottom:12px;right:12px;
  color:rgba(255,255,255,.5);font-size:10px;text-align:right;
  z-index:200;pointer-events:none;line-height:1.8
}
/* Info popup */
#info{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,rgba(10,22,40,.97),rgba(20,42,72,.97));
  color:#fff;padding:16px 22px;border-radius:14px;
  border:1px solid rgba(126,255,126,.35);
  max-width:500px;width:88vw;
  box-shadow:0 8px 32px rgba(0,0,0,.7);
  display:none;z-index:300;text-align:center
}
#info h3{color:#7EFF7E;font-size:15px;margin-bottom:8px}
#info p{font-size:12px;line-height:1.65;color:#cde}
#info-close{
  margin-top:12px;background:#1a7a1a;border:none;
  color:#fff;padding:7px 22px;border-radius:20px;
  cursor:pointer;font-size:12px
}
/* Legend */
#legend{
  position:fixed;top:82px;left:12px;z-index:200;
  background:rgba(0,0,0,.55);border-radius:10px;
  padding:9px 13px;pointer-events:none
}
#legend h4{color:#7EFF7E;font-size:10px;margin-bottom:5px;letter-spacing:.5px}
.lr{display:flex;align-items:center;gap:7px;margin:3px 0;font-size:10px;color:#cde}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <h1>🌿 Sistema de Biogás — Colombia Rural</h1>
  <p>Residuos de ganado → Biodigestor → Electricidad limpia</p>
</div>

<div id="hint">
  👆 Arrastrar: rotar &nbsp;|&nbsp; Pellizcar / rueda: zoom<br>
  👆 Tocar componente: más información
</div>

<div id="legend">
  <h4>FLUJO DE ENERGÍA</h4>
  <div class="lr"><div class="ld" style="background:#00ff44"></div>Residuos orgánicos</div>
  <div class="lr"><div class="ld" style="background:#ffe000"></div>Gas metano CH₄</div>
  <div class="lr"><div class="ld" style="background:#ffffff"></div>Electricidad</div>
</div>

<div id="info">
  <h3 id="info-title">Componente</h3>
  <p id="info-text">Descripción</p>
  <button id="info-close" onclick="document.getElementById('info').style.display='none'">✕ Cerrar</button>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   INFO DATA
════════════════════════════════════════════════════════════ */
var INFO={
  COW:{
    title:'🐄 Vaca – Fuente de Materia Orgánica',
    text:'El ganado vacuno produce entre 10 y 15 kg de estiércol por día, rico en materia orgánica y bacterias metanogénicas. En zonas rurales de Colombia, la ganadería extensiva es muy común, convirtiendo el estiércol bovino en un recurso energético abundante y renovable para las comunidades aisladas.'
  },
  WASTE:{
    title:'💩 Residuos de Ganado',
    text:'El estiércol fresco se mezcla con agua (proporción 1:1) antes de ingresar al biodigestor. Esta mezcla se llama "biol" y está llena de microorganismos que inician la digestión anaerobia. El residuo sólido sobrante es un excelente fertilizante orgánico para cultivos locales.'
  },
  DIGESTER:{
    title:'⚙️ Biodigestor Anaeróbico',
    text:'Tanque hermético donde la materia orgánica se descompone sin oxígeno. Puede procesar 50–200 litros diarios. La digestión tarda 15–40 días a 25–40°C, temperaturas que se dan naturalmente en el clima tropical colombiano. Puede ser de tipo tubular (plástico), cúpula fija (concreto) o flotante (acero).'
  },
  BACTERIA:{
    title:'🦠 Bacterias Metanogénicas',
    text:'Las arqueas metanogénicas (como Methanobacterium y Methanosarcina) descomponen la materia orgánica y producen metano (CH₄) como subproducto. Viven naturalmente en el estiércol de ganado y el clima cálido de Colombia les da la temperatura ideal para su actividad máxima.'
  },
  METHANE:{
    title:'💨 Gas Metano (CH₄)',
    text:'El biogás producido contiene 55–70% de metano. Se captura en la cúpula del biodigestor y se transporta por tuberías hasta el generador. Una vaca puede producir suficiente biogás para encender lámparas varias horas al día. Comparado con la leña, el biogás produce mucho menos contaminación.'
  },
  GENERATOR:{
    title:'⚡ Generador de Biogás',
    text:'Convierte el metano en electricidad mediante un motor de combustión interna acoplado a un alternador. Un generador pequeño (1–5 kW) con biogás puede abastecer iluminación LED, nevera pequeña, carga de celulares y equipos educativos en una comunidad rural colombiana.'
  },
  CABLES:{
    title:'🔌 Mini-Red Eléctrica Local',
    text:'La electricidad se distribuye por una mini-red de baja tensión con postes de madera, llegando a varias viviendas. Esta solución beneficia especialmente a comunidades en la Amazonía, el Pacífico y los Andes de Colombia, donde la red eléctrica nacional no llega.'
  },
  HOUSE:{
    title:'🏠 Hogar Rural – Comunidad Aislada',
    text:'Representa a miles de familias colombianas sin acceso a la red eléctrica. Con biogás obtienen: iluminación nocturna para estudiar, refrigeración para alimentos y medicinas, carga de celulares y comunicación, y acceso a educación digital. Se reduce el uso de velas y leña, mejorando la salud y el medio ambiente.'
  }
};

/* ════════════════════════════════════════════════════════════
   SETUP
════════════════════════════════════════════════════════════ */
var W=function(){return window.innerWidth;};
var H=function(){return window.innerHeight;};

var renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W(),H());
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

var labelRenderer=new THREE.CSS2DRenderer();
labelRenderer.setSize(W(),H());
labelRenderer.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;';
document.getElementById('app').appendChild(labelRenderer.domElement);

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x6AAFDA);
scene.fog=new THREE.FogExp2(0x6AAFDA,0.016);

var camera=new THREE.PerspectiveCamera(55,W()/H(),0.1,120);
camera.position.set(0,8,22);

var controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.dampingFactor=0.06;
controls.minDistance=6;
controls.maxDistance=48;
controls.maxPolarAngle=Math.PI*0.82;
controls.update();

/* ── Lighting ── */
scene.add(new THREE.AmbientLight(0xffffff,0.5));

var sun=new THREE.DirectionalLight(0xFFF4CC,1.4);
sun.position.set(8,18,10);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.left=-22;sun.shadow.camera.right=22;
sun.shadow.camera.top=18;sun.shadow.camera.bottom=-18;
scene.add(sun);

var underLight=new THREE.PointLight(0x886644,1.8,12);
underLight.position.set(-3.7,-2.5,0);
scene.add(underLight);

/* ── Raycaster ── */
var raycaster=new THREE.Raycaster();
var mouse=new THREE.Vector2();
var clickables=[];
var mouseDown=new THREE.Vector2();

function makeHitbox(geo,x,y,z,id){
  var m=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(x,y,z);
  m.userData.id=id;
  scene.add(m);
  clickables.push(m);
  return m;
}

/* ── Labels ── */
function addLabel(text,x,y,z){
  var div=document.createElement('div');
  div.className='lbl';
  div.textContent=text;
  var obj=new THREE.CSS2DObject(div);
  obj.position.set(x,y,z);
  scene.add(obj);
  return obj;
}

/* ════════════════════════════════════════════════════════════
   TERRAIN
════════════════════════════════════════════════════════════ */
var grassMat=new THREE.MeshLambertMaterial({color:0x3d9e3d});

// Far background
var bgGrass=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshLambertMaterial({color:0x358435}));
bgGrass.rotation.x=-Math.PI/2; bgGrass.position.set(0,-0.01,0); bgGrass.receiveShadow=true;
scene.add(bgGrass);

// Left grass slab (x: -18 → -6.8)
var lg=new THREE.Mesh(new THREE.PlaneGeometry(11.2,14),grassMat);
lg.rotation.x=-Math.PI/2; lg.position.set(-12.4,0,0); lg.receiveShadow=true;
scene.add(lg);

// Right grass slab (x: -0.4 → 18)
var rg=new THREE.Mesh(new THREE.PlaneGeometry(18.4,14),grassMat);
rg.rotation.x=-Math.PI/2; rg.position.set(8.8,0,0); rg.receiveShadow=true;
scene.add(rg);

/* ── Underground cross-section box (open top + open front) ──
   x: -6.8 … -0.4   y: -5 … 0   z: -3.5 … 3.5          */
var soilMat=new THREE.MeshLambertMaterial({color:0x7a4520,side:THREE.DoubleSide});

// Back wall
var bw=new THREE.Mesh(new THREE.PlaneGeometry(6.4,5),soilMat);
bw.position.set(-3.6,-2.5,-3.5); scene.add(bw);

// Geology layers on back wall
var lc=[0x5c3a1a,0x6b4422,0x8b5e3c,0x4a3010,0x7a6050];
var ly=[-0.4,-1.2,-2.1,-3.2,-4.3];
lc.forEach(function(c,i){
  var lm=new THREE.Mesh(new THREE.PlaneGeometry(6.4,0.45),new THREE.MeshLambertMaterial({color:c,side:THREE.DoubleSide}));
  lm.position.set(-3.6,ly[i],-3.48); scene.add(lm);
});

// Left wall
var lw=new THREE.Mesh(new THREE.PlaneGeometry(7,5),soilMat);
lw.rotation.y=Math.PI/2; lw.position.set(-6.8,-2.5,0); scene.add(lw);

// Right wall
var rw2=new THREE.Mesh(new THREE.PlaneGeometry(7,5),soilMat);
rw2.rotation.y=-Math.PI/2; rw2.position.set(-0.4,-2.5,0); scene.add(rw2);

// Floor
var fl=new THREE.Mesh(new THREE.PlaneGeometry(6.4,7),new THREE.MeshLambertMaterial({color:0x5a3510,side:THREE.DoubleSide}));
fl.rotation.x=-Math.PI/2; fl.position.set(-3.6,-5,0); scene.add(fl);

// Dark trim at ground level over the cut
var trim=new THREE.Mesh(new THREE.BoxGeometry(6.4,0.18,7),new THREE.MeshLambertMaterial({color:0x3d1e08}));
trim.position.set(-3.6,-0.09,0); scene.add(trim);

/* ════════════════════════════════════════════════════════════
   COW  (x = -10.5)
════════════════════════════════════════════════════════════ */
var cowG=new THREE.Group();
var cowMat=new THREE.MeshLambertMaterial({color:0xF2DDB8});
var spotMat=new THREE.MeshLambertMaterial({color:0x1a1a1a});
var legMat=new THREE.MeshLambertMaterial({color:0xC8A880});
var hoofMat=new THREE.MeshLambertMaterial({color:0x222222});
var snoutMat=new THREE.MeshLambertMaterial({color:0xFFB0B0});

// Body
var body=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.1,2.8),cowMat);
body.position.set(0,1.15,0); body.castShadow=true; cowG.add(body);
// Spots
[[-.4,1.22,.4,.7,.06,1.0],[.3,1.22,-.5,.6,.06,.9]].forEach(function(d){
  var s=new THREE.Mesh(new THREE.BoxGeometry(d[3],d[4],d[5]),spotMat);
  s.position.set(d[0],d[1],d[2]); cowG.add(s);
});
// Head
var head=new THREE.Mesh(new THREE.BoxGeometry(.9,.85,.9),cowMat);
head.position.set(0,1.85,1.55); head.castShadow=true; cowG.add(head);
// Snout
var snout=new THREE.Mesh(new THREE.BoxGeometry(.55,.32,.38),snoutMat);
snout.position.set(0,1.67,2.02); cowG.add(snout);
// Nostrils
[[-.12,1.67,2.22],[.12,1.67,2.22]].forEach(function(p){
  var n=new THREE.Mesh(new THREE.SphereGeometry(.04,6,4),new THREE.MeshLambertMaterial({color:0x662222}));
  n.position.set(p[0],p[1],p[2]); cowG.add(n);
});
// Horns
var hornMat=new THREE.MeshLambertMaterial({color:0xD4B896});
[-.35,.35].forEach(function(sx){
  var h=new THREE.Mesh(new THREE.CylinderGeometry(.045,.02,.5,6),hornMat);
  h.position.set(sx,2.4,1.45); h.rotation.z=sx<0?.4:-.4; cowG.add(h);
});
// Ears
[-.55,.55].forEach(function(sx){
  var e=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),cowMat);
  e.scale.set(1,.6,1); e.position.set(sx,1.95,1.45); cowG.add(e);
});
// Legs + hooves
[[-0.65,0.5,1.0],[0.65,0.5,1.0],[-0.65,0.5,-1.0],[0.65,0.5,-1.0]].forEach(function(p){
  var leg=new THREE.Mesh(new THREE.CylinderGeometry(.19,.16,.9,8),legMat);
  leg.position.set(p[0],p[1],p[2]); leg.castShadow=true; cowG.add(leg);
  var hoof=new THREE.Mesh(new THREE.CylinderGeometry(.17,.14,.18,8),hoofMat);
  hoof.position.set(p[0],.05,p[2]); cowG.add(hoof);
});
// Tail
var tail=new THREE.Mesh(new THREE.CylinderGeometry(.04,.02,1,6),cowMat);
tail.position.set(0,1.3,-1.55); tail.rotation.x=.9; cowG.add(tail);
var tailTip=new THREE.Mesh(new THREE.SphereGeometry(.1,6,4),new THREE.MeshLambertMaterial({color:0x8B7355}));
tailTip.position.set(0,.55,-2.1); cowG.add(tailTip);
// Udder
var udder=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),snoutMat);
udder.scale.set(1,.7,1); udder.position.set(0,.6,.3); cowG.add(udder);

cowG.position.set(-10.5,0,0); scene.add(cowG);
makeHitbox(new THREE.BoxGeometry(2.5,2.8,3.5),-10.5,1.2,0,'COW');
addLabel('COW 🐄',-10.5,2.9,0);

/* ════════════════════════════════════════════════════════════
   COW WASTE  (x = -8.5)
════════════════════════════════════════════════════════════ */
var wasteMat=new THREE.MeshLambertMaterial({color:0x6B3A1A});
var wasteG=new THREE.Group();
[[0,.12,0,.42,.5],[-.28,.08,-.1,.28,.5],[.22,.08,.1,.25,.5],[.1,.22,.1,.2,.5]].forEach(function(d){
  var s=new THREE.Mesh(new THREE.SphereGeometry(d[3],8,6),wasteMat);
  s.scale.set(1,d[4],1); s.position.set(d[0],d[1],d[2]); wasteG.add(s);
});
wasteG.position.set(-8.5,0,0); scene.add(wasteG);
makeHitbox(new THREE.BoxGeometry(1.4,.9,1.4),-8.5,.35,0,'WASTE');
addLabel('COW WASTE 💩',-8.5,1.2,0);

/* ════════════════════════════════════════════════════════════
   PIPES
════════════════════════════════════════════════════════════ */
var pipeMat=new THREE.MeshLambertMaterial({color:0x7a8a8a});

function makePipe(r,len,x,y,z,rx,ry,rz){
  rx=rx||0; ry=ry||0; rz=rz||0;
  var m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,10),pipeMat);
  m.position.set(x,y,z); m.rotation.set(rx,ry,rz);
  scene.add(m); return m;
}

// Waste → down underground
makePipe(.12,.6,-8.5,-.3,0);
makePipe(.12,3.5,-8.5,-2.25,0);
// Horizontal underground to digester
makePipe(.12,4.82,-6.06,-3.8,0, 0,0,Math.PI/2);
// Rise inside digester
makePipe(.12,2.8,-3.7,-2.4,0);

// Methane pipe (vertical up from digester)
makePipe(.1,1.4,-3.7,-.6,0);

// Valve wheel
var valveMat=new THREE.MeshLambertMaterial({color:0xff4444});
var valve=new THREE.Mesh(new THREE.TorusGeometry(.22,.07,8,16),valveMat);
valve.position.set(-3.7,.05,0); valve.rotation.x=Math.PI/2; scene.add(valve);
var vHandle=new THREE.Mesh(new THREE.CylinderGeometry(.05,.05,.44,6),valveMat);
vHandle.position.set(-3.7,.05,0); vHandle.rotation.z=Math.PI/2; scene.add(vHandle);

// Horizontal to generator
makePipe(.1,3.4,-1.9,.1,0, 0,0,Math.PI/2);
makePipe(.1,.5,-.2,.25,0);

makeHitbox(new THREE.CylinderGeometry(.35,.35,1.5,10),-3.7,-.3,0,'METHANE');
addLabel('METANO CH₄ 💨',-3.7,.85,0);

/* ════════════════════════════════════════════════════════════
   BIODIGESTER  (x=-3.7, y=-3.0)
════════════════════════════════════════════════════════════ */
var digMat=new THREE.MeshLambertMaterial({color:0x4a6070});

var digBody=new THREE.Mesh(new THREE.CylinderGeometry(2.0,2.0,3.4,20),digMat);
digBody.position.set(-3.7,-3.0,0); digBody.castShadow=true; scene.add(digBody);

var digDome=new THREE.Mesh(new THREE.SphereGeometry(2.0,20,10,0,Math.PI*2,0,Math.PI/2),digMat);
digDome.position.set(-3.7,-1.3,0); scene.add(digDome);

var digBot=new THREE.Mesh(new THREE.SphereGeometry(2.0,20,10,0,Math.PI*2,Math.PI/2,Math.PI/2),digMat);
digBot.position.set(-3.7,-4.7,0); scene.add(digBot);

// Liquid
var liquidMat=new THREE.MeshLambertMaterial({color:0x6B3A0A,transparent:true,opacity:.9});
var liquid=new THREE.Mesh(new THREE.CylinderGeometry(1.92,1.92,2.0,20),liquidMat);
liquid.position.set(-3.7,-3.3,0); scene.add(liquid);

// Ribs
var ribMat=new THREE.MeshLambertMaterial({color:0x3a5060});
for(var ri=0;ri<6;ri++){
  var rib=new THREE.Mesh(new THREE.TorusGeometry(2.04,.04,6,20),ribMat);
  rib.position.set(-3.7,-1.6+ri*.6,0); scene.add(rib);
}

makeHitbox(new THREE.CylinderGeometry(2.2,2.2,5,16),-3.7,-2.8,0,'DIGESTER');
addLabel('BIODIGESTOR ⚙️',-3.7,-1.0,0);

/* ════════════════════════════════════════════════════════════
   BACTERIA BUBBLES
════════════════════════════════════════════════════════════ */
var bacMat=new THREE.MeshLambertMaterial({color:0x22ff66,emissive:0x005500,transparent:true,opacity:.85});
var bacGroup=new THREE.Group();
var bacData=[];
for(var bi=0;bi<18;bi++){
  var br=.9+Math.random()*1.0, ba=Math.random()*Math.PI*2;
  var bx=br*Math.cos(ba), bz2=br*Math.sin(ba), by=-3.8+Math.random()*2.0;
  var bac=new THREE.Mesh(new THREE.SphereGeometry(.1+Math.random()*.09,7,5),bacMat);
  bac.position.set(bx,by,bz2); bacGroup.add(bac);
  bacData.push({ox:bx,oy:by,oz:bz2,phase:Math.random()*Math.PI*2,sp:.8+Math.random()*.6});
}
bacGroup.position.set(-3.7,0,0); scene.add(bacGroup);

makeHitbox(new THREE.CylinderGeometry(1.6,1.6,2.0,12),-3.7,-3.4,0,'BACTERIA');
addLabel('BACTERIA 🦠',-3.7,-4.2,0);

/* ════════════════════════════════════════════════════════════
   GENERATOR  (x=1.0)
════════════════════════════════════════════════════════════ */
var genG=new THREE.Group();

var genFrame=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.1,1.1),new THREE.MeshLambertMaterial({color:0x2d3f50}));
genFrame.position.set(0,.55,0); genFrame.castShadow=true; genG.add(genFrame);

var engBlk=new THREE.Mesh(new THREE.BoxGeometry(.75,.72,.7),new THREE.MeshLambertMaterial({color:0x3a4f62}));
engBlk.position.set(-.3,.5,.2); genG.add(engBlk);

var altMesh=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.55,10),new THREE.MeshLambertMaterial({color:0xCC9900}));
altMesh.rotation.x=Math.PI/2; altMesh.position.set(.4,.5,.2); genG.add(altMesh);

for(var fi=0;fi<8;fi++){
  var fin=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.55),new THREE.MeshLambertMaterial({color:0xAA8800}));
  fin.position.set(.4+.3*Math.cos(fi*Math.PI/4),.5+.3*Math.sin(fi*Math.PI/4),.2); genG.add(fin);
}

var panel=new THREE.Mesh(new THREE.BoxGeometry(.55,.45,.04),new THREE.MeshLambertMaterial({color:0x0a1a2e}));
panel.position.set(-.2,.62,.57); genG.add(panel);

var greenLed=new THREE.Mesh(new THREE.SphereGeometry(.05,6,4),new THREE.MeshLambertMaterial({color:0x00ff44,emissive:0x007722}));
greenLed.position.set(-.05,.7,.6); genG.add(greenLed);

exhaust.position.set(.55,1.2,.0); genG.add(exhaust);

function cable(pts,r,col){
  r=r||.022; col=col||0x111111;
  var vectors=pts.map(function(p){return new THREE.Vector3(p[0],p[1],p[2]);});
  var curve=new THREE.CatmullRomCurve3(vectors);
  var geo=new THREE.TubeGeometry(curve,pts.length*5,r,5,false);
  var m=new THREE.Mesh(geo,new THREE.MeshLambertMaterial({color:col}));
  scene.add(m); return m;
}

// Path functions
function greenPath(t){
  if(t<.15) return new THREE.Vector3(-8.5,-t/.15*.3,0);
  if(t<.35){var s=(t-.15)/.2; return new THREE.Vector3(-8.5,-0.3-s*3.5,0);}
  var s=(t-.35)/.65; return new THREE.Vector3(-8.5+s*4.8,-3.8,0);
}
function yellowPath(t){
  if(t<.5){var s=t/.5; return new THREE.Vector3(-3.7,-4.0+s*4.2,Math.sin(s*Math.PI*.5)*.3);}
  var s=(t-.5)/.5; return new THREE.Vector3(-3.7+s*4.75,.1,0);
}
function whitePath(t){
  var pts=[
    new THREE.Vector3(1.8,.9,0),new THREE.Vector3(3.1,2.2,0),
    new THREE.Vector3(4.2,4.4,0),new THREE.Vector3(5.6,4.2,0),
    new THREE.Vector3(7.0,4.4,0),new THREE.Vector3(8.4,3.6,0),
    new THREE.Vector3(9.8,2.8,0),new THREE.Vector3(11.0,1.5,0)
  ];
  var total=pts.length-1, scaled=t*total;
  var idx=Math.min(Math.floor(scaled),total-1);
  return pts[idx].clone().lerp(pts[idx+1],scaled-idx);
}

function makeParticles(count,color,size){
  var pos=new Float32Array(count*3);
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var mat=new THREE.PointsMaterial({color:color,size:size||.18,transparent:true,opacity:.9,sizeAttenuation:true,depthWrite:false});
  var pts=new THREE.Points(geo,mat);
  scene.add(pts);
  return {pts:pts,pos:pos,geo:geo};
}

var gT=[],yT=[],wT=[];
for(var i=0;i<GP;i++) gT.push({t:Math.random(),sp:.003+Math.random()*.002,jz:(Math.random()-.5)*.25});
for(var i=0;i<YP;i++) yT.push({t:Math.random(),sp:.004+Math.random()*.003,jz:(Math.random()-.5)*.3});

/* ════════════════════════════════════════════════════════════
   CLICK / TOUCH HANDLER
════════════════════════════════════════════════════════════ */
function onPointerDown(e){
  var cx=e.clientX!==undefined?e.clientX:(e.touches&&e.touches[0]?e.touches[0].clientX:0);
  var cy=e.clientY!==undefined?e.clientY:(e.touches&&e.touches[0]?e.touches[0].clientY:0);
  mouseDown.set(cx,cy);
}
function onPointerUp(e){
  var cx=e.clientX!==undefined?e.clientX:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientX:0);
  var cy=e.clientY!==undefined?e.clientY:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientY:0);
  if(Math.abs(cx-mouseDown.x)>8||Math.abs(cy-mouseDown.y)>8) return;
  mouse.set((cx/W())*2-1,-(cy/H())*2+1);
  raycaster.setFromCamera(mouse,camera);
  var hits=raycaster.intersectObjects(clickables,false);
  if(!hits.length) return;
  var id=hits[0].object.userData.id;
  if(!INFO[id]) return;
  document.getElementById('info-title').textContent=INFO[id].title;
  document.getElementById('info-text').textContent=INFO[id].text;
  document.getElementById('info').style.display='block';
}

renderer.domElement.addEventListener('pointerdown',onPointerDown);
renderer.domElement.addEventListener('pointerup',onPointerUp);
// Extra touch events for Safari iOS which may not fire pointer events properly
renderer.domElement.addEventListener('touchstart',onPointerDown,{passive:true});
renderer.domElement.addEventListener('touchend',onPointerUp,{passive:true});

/* ════════════════════════════════════════════════════════════
   ANIMATION LOOP
════════════════════════════════════════════════════════════ */
var clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  var t=clock.getElapsedTime();
  controls.update();

  // Bacteria bob
  bacData.forEach(function(d,i){
    var b=bacGroup.children[i];
    b.position.set(
      d.ox+Math.sin(t*d.sp*2.5+d.phase)*.12,
      d.oy+Math.sin(t*d.sp*1.8+d.phase+1)*.18,
      d.oz+Math.cos(t*d.sp*2+d.phase)*.1
    );
  });
  bacMat.emissiveIntensity=.25+Math.sin(t*2.2)*.15;
  windowMat.emissiveIntensity=.8+Math.sin(t*1.8)*.15;
  greenLed.material.emissiveIntensity=.5+Math.sin(t*4)*.3;

  // Clouds drift
  clouds.forEach(function(c,i){
    c.position.x+=.003*(i%2===0?1:-1);
    if(c.position.x>20) c.position.x=-18;
    if(c.position.x<-20) c.position.x=18;
  });

  // Alternator spin
  altMesh.rotation.z=t*3;

  // Particles
  var i,p;
  for(i=0;i<GP;i++){
    gT[i].t=(gT[i].t+gT[i].sp)%1;
    p=greenPath(gT[i].t);
    gp.pos[i*3]=p.x+(Math.random()-.5)*.04;
    gp.pos[i*3+1]=p.y+(Math.random()-.5)*.04;
    gp.pos[i*3+2]=p.z+gT[i].jz;
  }
  gp.geo.attributes.position.needsUpdate=true;

  for(i=0;i<YP;i++){
    yT[i].t=(yT[i].t+yT[i].sp)%1;
    p=yellowPath(yT[i].t);
    yp.pos[i*3]=p.x+(Math.random()-.5)*.05;
    yp.pos[i*3+1]=p.y+(Math.random()-.5)*.05;
    yp.pos[i*3+2]=p.z+yT[i].jz;
  }
  yp.geo.attributes.position.needsUpdate=true;

  for(i=0;i<WP;i++){
    wT[i].t=(wT[i].t+wT[i].sp)%1;
    p=whitePath(wT[i].t);
    wp.pos[i*3]=p.x+(Math.random()-.5)*.04;
    wp.pos[i*3+1]=p.y+(Math.random()-.5)*.04;
    wp.pos[i*3+2]=p.z+wT[i].jz;
  }
  wp.geo.attributes.position.needsUpdate=true;

  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}

animate();
