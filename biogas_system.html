<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Sistema de Biogás — Colombia Rural</title>
<!-- Using jsDelivr CDN (more reliable) -->
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/renderers/CSS2DRenderer.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a1a2e;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
#app{width:100vw;height:100vh;position:relative}
canvas{display:block;width:100%!important;height:100%!important}
.lbl{
  color:#fff;font-size:10px;font-weight:700;
  background:rgba(5,14,26,.8);padding:4px 11px;border-radius:20px;
  border:1px solid rgba(80,210,130,.5);pointer-events:none;
  white-space:nowrap;letter-spacing:.7px;text-transform:uppercase
}
#hud{
  position:fixed;top:0;left:0;right:0;padding:14px 16px 30px;
  background:linear-gradient(to bottom,rgba(5,12,22,.88),transparent);
  pointer-events:none;z-index:200;text-align:center
}
#hud h1{font-size:17px;font-weight:700;color:#fff;letter-spacing:.3px;
  text-shadow:0 0 20px rgba(80,210,130,.55)}
#hud h1 span{color:#50D282}
#hud p{font-size:11px;color:rgba(255,255,255,.5);margin-top:5px;letter-spacing:.3px}
#hint{
  position:fixed;bottom:14px;right:14px;
  color:rgba(255,255,255,.38);font-size:10px;
  text-align:right;z-index:200;pointer-events:none;line-height:2
}
#info{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  width:min(510px,90vw);
  background:rgba(5,14,26,.95);
  border:1px solid rgba(80,210,130,.25);border-radius:16px;
  padding:18px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  display:none;z-index:300
}
#info-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#info h3{color:#50D282;font-size:14px;font-weight:700}
#info-x{background:rgba(80,210,130,.12);border:1px solid rgba(80,210,130,.3);
  color:#50D282;width:28px;height:28px;border-radius:50%;cursor:pointer;
  font-size:13px;display:flex;align-items:center;justify-content:center}
#info p{font-size:12px;line-height:1.75;color:rgba(200,225,212,.9)}
#legend{
  position:fixed;top:76px;left:14px;z-index:200;
  background:rgba(5,14,26,.72);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:11px 14px;pointer-events:none
}
#legend h4{color:rgba(255,255,255,.38);font-size:9px;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.lr{display:flex;align-items:center;gap:8px;margin:5px 0;
  font-size:10px;color:rgba(200,220,210,.85)}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
#err{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(180,0,0,.9);color:#fff;padding:20px 28px;border-radius:12px;
  font-size:13px;z-index:999;text-align:center;max-width:80vw}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>🌿 <span>Sistema de Biogás</span> — Energía para Colombia Rural</h1>
  <p>Residuos de ganado · Biodigestor · Bacterias metanogénicas · Electricidad limpia</p>
</div>
<div id="hint">✦ Arrastrar: rotar &nbsp;·&nbsp; Rueda / pellizcar: zoom<br>✦ Clic en componente: más información</div>
<div id="legend">
  <h4>Flujo de Energía</h4>
  <div class="lr"><div class="ld" style="background:#00ff88"></div>Residuos orgánicos</div>
  <div class="lr"><div class="ld" style="background:#ffcc00"></div>Gas metano CH₄</div>
  <div class="lr"><div class="ld" style="background:#88ccff"></div>Electricidad</div>
</div>
<div id="info">
  <div id="info-hdr">
    <h3 id="info-title"></h3>
    <button id="info-x" onclick="document.getElementById('info').style.display='none'">✕</button>
  </div>
  <p id="info-text"></p>
</div>
<div id="err"></div>

<script>
/* ─── global error catcher ─── */
window.onerror = function(msg, src, line) {
  var el = document.getElementById('err');
  el.textContent = '⚠ Error (line ' + line + '): ' + msg;
  el.style.display = 'block';
};

/* ─── INFO ─── */
var INFO = {
  COW:{ title:'🐄 Vaca — Fuente de Materia Orgánica',
    text:'Cada vaca produce 10–15 kg de estiércol diario, rico en materia orgánica y bacterias metanogénicas. La ganadería extensiva de Colombia convierte este residuo en un recurso energético renovable para comunidades rurales aisladas sin acceso a la red eléctrica nacional.' },
  WASTE:{ title:'💩 Residuos de Ganado — Materia Prima',
    text:'El estiércol se mezcla con agua (1:1) formando el "biol", que se vierte al biodigestor. Esta mezcla activa los microorganismos que inician la digestión anaerobia. El residuo digerido final es un fertilizante orgánico de alta calidad que mejora los suelos agrícolas locales.' },
  DIGESTER:{ title:'⚙️ Biodigestor Anaeróbico — El Corazón del Sistema',
    text:'Tanque hermético donde la materia orgánica se descompone sin oxígeno. Procesa 50–500 L de slurry diarios según su tamaño. La digestión tarda 15–40 días a 25–40 °C —temperaturas naturales en el clima tropical colombiano. Tipos comunes: tubular (plástico), cúpula fija (concreto) o globo (geomembrana).' },
  BACTERIA:{ title:'🦠 Bacterias Metanogénicas — Motor Biológico',
    text:'Las arqueas metanogénicas (Methanobacterium, Methanosarcina) descomponen la materia orgánica y producen CH₄. Presentes de forma natural en el estiércol bovino, operan a 30–37 °C —condiciones que el clima colombiano provee naturalmente, eliminando la necesidad de calefacción artificial.' },
  METHANE:{ title:'💨 Metano CH₄ — Energía Capturada',
    text:'El biogás contiene 55–70 % de metano. Se acumula en la cúpula del biodigestor y fluye a presión constante hacia el generador. Una vaca genera ~1 m³/día de biogás, suficiente para 10 horas de iluminación LED. La válvula roja controla el flujo y garantiza la seguridad ante sobrepresiones.' },
  GENERATOR:{ title:'⚡ Generador de Biogás — Conversión Energética',
    text:'Motor de combustión interna adaptado para metano, acoplado a un alternador que produce 110 V/60 Hz. Un generador de 2 kW alimentado con biogás puede abastecer: 8–12 lámparas LED, una nevera pequeña, carga de celulares y televisor. Eficiencia eléctrica: 25–30 %.' },
  CABLES:{ title:'🔌 Mini-Red Eléctrica — Distribución Local',
    text:'Red de baja tensión con postes de madera y conductores de cobre que distribuye electricidad a varias viviendas rurales. Un sistema de 2–5 kW sirve 4–10 hogares hasta 500 m de distancia. Incluye fusibles, pararrayos y medidores individuales. Costo aproximado: USD 800–2 500.' },
  HOUSE:{ title:'🏠 Hogar Rural — Beneficiario Final',
    text:'Familias en comunidades aisladas de Colombia (Amazonía, Pacífico, Andes) sin acceso a la red eléctrica nacional. Con biogás obtienen: iluminación nocturna segura, refrigeración para alimentos y medicinas, conectividad digital y acceso a educación. Se eliminan las velas y la leña, mejorando la salud y reduciendo la deforestación.' }
};

/* ─── RENDERER ─── */
function W(){ return window.innerWidth; }
function H(){ return window.innerHeight; }

var renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

var labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(W(), H());
labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
document.getElementById('app').appendChild(labelRenderer.domElement);

var scene = new THREE.Scene();
/* Sky-blue fallback background (visible if shader dome fails) */
scene.background = new THREE.Color(0x7ecce3);
scene.fog = new THREE.FogExp2(0x7ecce3, 0.011);

var camera = new THREE.PerspectiveCamera(52, W() / H(), 0.1, 200);
camera.position.set(1, 9, 23);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(1, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 5;
controls.maxDistance = 52;
controls.maxPolarAngle = Math.PI * 0.80;
controls.update();

/* ─── SKY DOME ─── */
var skyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(90, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: {
      uTop:   { value: new THREE.Color(0x0c1e3d) },
      uMid:   { value: new THREE.Color(0x1a6faa) },
      uHoriz: { value: new THREE.Color(0x7ecce3) }
    },
    vertexShader: [
      'varying float vWorldY;',
      'void main(){',
      '  vWorldY = (modelMatrix * vec4(position,1.0)).y;',
      '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform vec3 uTop, uMid, uHoriz;',
      'varying float vWorldY;',
      'void main(){',
      '  float t1 = clamp(vWorldY / 15.0, 0.0, 1.0);',
      '  float t2 = clamp(vWorldY / 82.0, 0.0, 1.0);',
      '  vec3 c = mix(uHoriz, uMid, t1);',
      '  c = mix(c, uTop, t2);',
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide,
    depthWrite: false
  })
);
scene.add(skyMesh);

/* ─── LIGHTING ─── */
scene.add(new THREE.HemisphereLight(0x9DCFEA, 0x2E6B1A, 0.45));

var sun = new THREE.DirectionalLight(0xFFF5D8, 1.8);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.width  = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left   = -28;
sun.shadow.camera.right  =  28;
sun.shadow.camera.top    =  24;
sun.shadow.camera.bottom = -24;
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 70;
sun.shadow.bias          = -0.0004;
scene.add(sun);

var fillLight = new THREE.DirectionalLight(0x9EC5FF, 0.30);
fillLight.position.set(-12, 8, -6);
scene.add(fillLight);

var digGlow = new THREE.PointLight(0xFF8822, 3.0, 12);
digGlow.position.set(-3.7, -1.5, 0);
scene.add(digGlow);

var genGlow = new THREE.PointLight(0xAADDFF, 1.0, 6);
genGlow.position.set(1.0, 1.8, 0);
scene.add(genGlow);

var bulbGlow = new THREE.PointLight(0xFFCC44, 1.8, 6);
bulbGlow.position.set(11.5, 2.1, 2.5);
scene.add(bulbGlow);

/* ─── PBR MATERIAL HELPER ─── */
function std(o){ return new THREE.MeshStandardMaterial(o); }

/* ─── SCENE HELPERS ─── */
var clickables = [];

function hitbox(geo, x, y, z, id) {
  var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
    transparent: true, opacity: 0, side: THREE.DoubleSide, depthWrite: false
  }));
  m.position.set(x, y, z);
  m.userData.id = id;
  scene.add(m);
  clickables.push(m);
}

function lbl(text, x, y, z) {
  var d = document.createElement('div');
  d.className = 'lbl';
  d.textContent = text;
  var o = new THREE.CSS2DObject(d);
  o.position.set(x, y, z);
  scene.add(o);
}

function mesh(geo, mat, x, y, z, rx, ry, rz, cast) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x || 0, y || 0, z || 0);
  if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
  if (cast) m.castShadow = true;
  scene.add(m);
  return m;
}

function cyl(rt, rb, h, seg, mat, x, y, z, rx, ry, rz, cast) {
  return mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 12), mat, x, y, z, rx, ry, rz, cast);
}
function box(w, h, d, mat, x, y, z, rx, ry, rz, cast) {
  return mesh(new THREE.BoxGeometry(w, h, d), mat, x, y, z, rx, ry, rz, cast);
}
function sph(r, mat, x, y, z, sx, sy, sz) {
  var m = new THREE.Mesh(new THREE.SphereGeometry(r, 14, 10), mat);
  m.position.set(x || 0, y || 0, z || 0);
  if (sx) m.scale.set(sx, sy || 1, sz || 1);
  scene.add(m);
  return m;
}

/* ══════════════════════════════════════════════════════════
   TERRAIN
══════════════════════════════════════════════════════════ */
var matGrassA = std({ color: 0x2E8B3A, roughness: .95, metalness: 0 });
var matGrassB = std({ color: 0x1E6B2A, roughness: .95, metalness: 0 });
var matSoilA  = std({ color: 0x8B5E3C, roughness: .98, metalness: 0 });
var matSoilB  = std({ color: 0x6B4030, roughness: .98, metalness: 0 });
var matRock   = std({ color: 0x524D5C, roughness: .94, metalness: .04 });
var matConcr  = std({ color: 0x888888, roughness: .9,  metalness: 0 });
var matSoilSeam = std({ color: 0x2d1005, roughness: .99, metalness: 0 });

// Far background
mesh(new THREE.PlaneGeometry(180, 120), matGrassB, 0, -0.02, 0, -Math.PI/2);

// Left grass slab (x: -18 → -7)
mesh(new THREE.PlaneGeometry(11.4, 16), matGrassA, -12.3, 0, 0, -Math.PI/2);

// Right grass slab (x: -0.3 → 18)
mesh(new THREE.PlaneGeometry(19.0, 16), matGrassA, 9.15, 0, 0, -Math.PI/2);

// Concrete curbs around underground pit opening
var matCurb = std({ color: 0x777777, roughness: .72, metalness: .12 });
box(0.42, .40, 8.4, matCurb, -7.1,  .20, 0);  // left
box(0.42, .40, 8.4, matCurb, -0.3,  .20, 0);  // right
box(7.2,  .40, 0.4, matCurb, -3.7,  .20, -4.0); // back
box(7.2,  .40, 0.4, matCurb, -3.7,  .20,  4.0); // front

// Underground cross-section (open top, open front)
// Back wall
mesh(new THREE.PlaneGeometry(6.9, 5.6), matSoilA, -3.7, -2.8, -4.0);

// Geological layers on back wall
var geoLyr = [
  {c:0x5c3a1a,y:-0.30,h:.40}, {c:0x7a5a3a,y:-.90,h:.52},
  {c:0x8B5E3C,y:-1.68,h:.66}, {c:0xA07050,y:-2.60,h:.78},
  {c:0x6B4030,y:-3.54,h:.78}, {c:0x524D5C,y:-4.48,h:.74}
];
geoLyr.forEach(function(g) {
  var lm = new THREE.Mesh(new THREE.PlaneGeometry(6.9, g.h),
    std({ color: g.c, roughness: .98, metalness: 0 }));
  lm.position.set(-3.7, g.y, -3.97);
  scene.add(lm);
});

// Left wall
mesh(new THREE.PlaneGeometry(8.0, 5.6), matSoilB, -7.0, -2.8, 0, 0, Math.PI/2);
// Right wall
mesh(new THREE.PlaneGeometry(8.0, 5.6), matSoilB, -0.3, -2.8, 0, 0, -Math.PI/2);
// Floor
mesh(new THREE.PlaneGeometry(6.9, 8.0), matRock, -3.7, -5.5, 0, -Math.PI/2);
// Dark topsoil seam
box(6.9, .22, 8.0, matSoilSeam, -3.7, -0.11, 0);

/* ══════════════════════════════════════════════════════════
   COW  (centered at x = -10.5)
══════════════════════════════════════════════════════════ */
var cowG = new THREE.Group();
var matCowSkin = std({ color: 0xEED8A8, roughness: .90, metalness: 0 });
var matCowSpot = std({ color: 0x1A1A1A, roughness: .90, metalness: 0 });
var matCowPink = std({ color: 0xF0A0A0, roughness: .80, metalness: 0 });
var matCowHoof = std({ color: 0x1E1E1E, roughness: .85, metalness: .02 });
var matCowHorn = std({ color: 0xD4B880, roughness: .70, metalness: 0 });
var matCowEye  = std({ color: 0x1A1A2A, roughness: .40, metalness: .10 });
var matCowShine= std({ color: 0xffffff, roughness: .20, metalness: 0 });

function cadd(geo, mat, x, y, z, rx, ry, rz, cast) {
  var m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  if (rx || ry || rz) m.rotation.set(rx || 0, ry || 0, rz || 0);
  if (cast) m.castShadow = true;
  cowG.add(m);
  return m;
}

// Belly
cadd(new THREE.CylinderGeometry(.56, .56, 2.68, 14), matCowSkin, 0, .88, 0,  Math.PI/2, 0, 0);
// Body
cadd(new THREE.BoxGeometry(1.88, 1.12, 2.92), matCowSkin, 0, 1.22, 0, 0, 0, 0, true);
// Spots
cadd(new THREE.BoxGeometry(.72, .07, 1.08), matCowSpot, -.38, 1.29,  .44);
cadd(new THREE.BoxGeometry(.56, .07,  .92), matCowSpot,  .32, 1.29, -.62);
cadd(new THREE.BoxGeometry(.48, .07,  .70), matCowSpot, -.18, 1.29,-1.10);
// Neck
cadd(new THREE.CylinderGeometry(.32, .42, .68, 10), matCowSkin, 0, 1.66, 1.32, -.38, 0, 0);
// Head
cadd(new THREE.BoxGeometry(.96, .88, .96), matCowSkin, 0, 1.92, 1.68, 0, 0, 0, true);
cadd(new THREE.SphereGeometry(.44, 12, 9), matCowSkin, 0, 1.90, 2.12);
// Snout
cadd(new THREE.CylinderGeometry(.28, .30, .22, 12), matCowPink, 0, 1.73, 2.18,  Math.PI/2, 0, 0);
// Nostrils
cadd(new THREE.SphereGeometry(.04, 6, 4), std({color:0x662222,roughness:.85,metalness:0}), -.10, 1.73, 2.30);
cadd(new THREE.SphereGeometry(.04, 6, 4), std({color:0x662222,roughness:.85,metalness:0}),  .10, 1.73, 2.30);
// Horns
cadd(new THREE.CylinderGeometry(.040, .015, .54, 7), matCowHorn, -.38, 2.44, 1.56, .12, 0,  .45);
cadd(new THREE.CylinderGeometry(.040, .015, .54, 7), matCowHorn,  .38, 2.44, 1.56, .12, 0, -.45);
// Ears
function cowEar(sx) {
  var e = new THREE.Mesh(new THREE.SphereGeometry(.20, 9, 7), matCowSkin);
  e.scale.set(1, .56, 1.2); e.position.set(sx, 2.00, 1.56);
  e.rotation.z = sx < 0 ? .2 : -.2; cowG.add(e);
  var ei = new THREE.Mesh(new THREE.SphereGeometry(.12, 9, 7), matCowPink);
  ei.scale.set(1, .40, .90); ei.position.set(sx * .94, 2.00, 1.62); cowG.add(ei);
}
cowEar(-.56); cowEar(.56);
// Eyes
cadd(new THREE.SphereGeometry(.06, 7, 5), matCowEye,  -.38, 2.05, 2.08);
cadd(new THREE.SphereGeometry(.06, 7, 5), matCowEye,   .38, 2.05, 2.08);
cadd(new THREE.SphereGeometry(.02, 5, 4), matCowShine, -.36, 2.07, 2.14);
cadd(new THREE.SphereGeometry(.02, 5, 4), matCowShine,  .40, 2.07, 2.14);
// Legs
var legPos = [[-0.67, 0.52, 1.06], [0.67, 0.52, 1.06], [-0.67, 0.52, -1.0], [0.67, 0.52, -1.0]];
legPos.forEach(function(p) {
  cadd(new THREE.CylinderGeometry(.22, .18, .62, 9), matCowSkin, p[0], p[1]+.42, p[2], 0,0,0, true);
  cadd(new THREE.CylinderGeometry(.17, .15, .67, 9), matCowSkin, p[0], p[1]-.04, p[2], 0,0,0, true);
  cadd(new THREE.CylinderGeometry(.16, .13, .20, 9), matCowHoof, p[0], .10, p[2]);
});
// Tail
cadd(new THREE.CylinderGeometry(.05, .03, .92, 7), matCowSkin, 0, 1.42, -1.58, .86, 0, 0);
cadd(new THREE.SphereGeometry(.12, 7, 5), std({color:0x9B7A45,roughness:.88,metalness:0}), 0, .62, -2.28);
// Udder + teats
cadd(new THREE.SphereGeometry(.30, 10, 8), matCowPink, 0, .66, .42);
[[-.1,.46,.58],[.1,.46,.58],[-.1,.46,.26],[.1,.46,.26]].forEach(function(p){
  cadd(new THREE.CylinderGeometry(.04,.03,.13,6), matCowPink, p[0],p[1],p[2]);
});

cowG.position.set(-10.5, 0, 0);
scene.add(cowG);
hitbox(new THREE.BoxGeometry(2.6, 2.9, 3.6), -10.5, 1.25, 0, 'COW');
lbl('COW  🐄', -10.5, 3.15, 0);

/* ══════════════════════════════════════════════════════════
   COW WASTE  (x = -8.4)
══════════════════════════════════════════════════════════ */
var matWaste = std({ color: 0x6B3A1A, roughness: .99, metalness: 0 });
var wasteG = new THREE.Group();
[[0,.13,0,.44,.48],[-.3,.09,-.10,.29,.48],[.26,.09,.10,.27,.48],[.10,.25,.10,.21,.48]].forEach(function(d){
  var s = new THREE.Mesh(new THREE.SphereGeometry(d[3], 9, 7), matWaste);
  s.scale.set(1.15, d[4], 1.1); s.position.set(d[0], d[1], d[2]); wasteG.add(s);
});
wasteG.position.set(-8.4, 0, 0);
scene.add(wasteG);
hitbox(new THREE.BoxGeometry(1.4, 1.0, 1.4), -8.4, .35, 0, 'WASTE');
lbl('COW WASTE  💩', -8.4, 1.25, 0);

/* ══════════════════════════════════════════════════════════
   UNDERGROUND PIPES

function greenPath(t) {
  if (t < .15) return new THREE.Vector3(-8.4, -t/.15*.28, 0);
  if (t < .36) { var s=(t-.15)/.21; return new THREE.Vector3(-8.4, -.28-s*3.54, 0); }
  var s2=(t-.36)/.64; return new THREE.Vector3(-8.4+s2*4.70, -3.82, 0);
}
function yellowPath(t) {
  if (t < .5) { var s=t/.5; return new THREE.Vector3(-3.7, -4.0+s*4.22, Math.sin(s*Math.PI*.5)*.32); }
  var s2=(t-.5)/.5; return new THREE.Vector3(-3.7+s2*4.78, .14, 0);
}
function whitePath(t) {
  var P = [
    new THREE.Vector3(2.1,1.1,0), new THREE.Vector3(3.4,2.6,0),
    new THREE.Vector3(4.4,4.82,0), new THREE.Vector3(5.9,4.58,0),
    new THREE.Vector3(7.4,4.82,0), new THREE.Vector3(8.8,4.0,0),
    new THREE.Vector3(10.0,3.2,0), new THREE.Vector3(11.4,1.7,0)
  ];
  var tot = P.length - 1, sc = t * tot;
  var idx = Math.min(Math.floor(sc), tot - 1);
  return P[idx].clone().lerp(P[idx+1], sc - idx);
}

function mkPts(n, color, size) {
  var pos = new Float32Array(n * 3);
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  var mat = new THREE.PointsMaterial({
    color: color, size: size, transparent: true, opacity: .82,
    sizeAttenuation: true, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var pts = new THREE.Points(geo, mat);
  scene.add(pts);
  return { pts: pts, pos: pos, geo: geo };
}

var wp = mkPts(wpN, 0x88CCFF, .20);

var gT=[], yT=[], wT=[];
for (var pi=0; pi<gpN; pi++) gT.push({t:Math.random(),sp:.003+Math.random()*.002,jz:(Math.random()-.5)*.30});
for (var pi=0; pi<ypN; pi++) yT.push({t:Math.random(),sp:.004+Math.random()*.003,jz:(Math.random()-.5)*.34});
for (var pi=0; pi<wpN; pi++) wT.push({t:Math.random(),sp:.0036+Math.random()*.002,jz:(Math.random()-.5)*.40});

/* ══════════════════════════════════════════════════════════
   CLICK / TOUCH
══════════════════════════════════════════════════════════ */
var ray = new THREE.Raycaster();
var ms  = new THREE.Vector2();
var md  = new THREE.Vector2();

function getXY(e) {
  if (e.clientX !== undefined) return { x: e.clientX, y: e.clientY };
  var t = e.touches || e.changedTouches;
  return t && t[0] ? { x: t[0].clientX, y: t[0].clientY } : { x: 0, y: 0 };
}
function onDown(e) { var p=getXY(e); md.set(p.x, p.y); }
function onUp(e) {
  var p = getXY(e);
  if (Math.abs(p.x-md.x) > 9 || Math.abs(p.y-md.y) > 9) return;
  ms.set((p.x/W())*2-1, -(p.y/H())*2+1);
  ray.setFromCamera(ms, camera);
  var hits = ray.intersectObjects(clickables, false);
  if (!hits.length) return;
  var id = hits[0].object.userData.id;
  if (!INFO[id]) return;
  document.getElementById('info-title').textContent = INFO[id].title;
  document.getElementById('info-text').textContent = INFO[id].text;
  document.getElementById('info').style.display = 'block';
}
renderer.domElement.addEventListener('pointerdown', onDown);
renderer.domElement.addEventListener('pointerup',   onUp);
renderer.domElement.addEventListener('touchstart', onDown, { passive: true });
renderer.domElement.addEventListener('touchend',   onUp,   { passive: true });

window.addEventListener('resize', function() {
  camera.aspect = W() / H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(), H());
  labelRenderer.setSize(W(), H());
});

/* ══════════════════════════════════════════════════════════
   ANIMATION LOOP
══════════════════════════════════════════════════════════ */
var clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();

  controls.update();

  /* Bacteria: bob + scale pulse */
  for (var bi2 = 0; bi2 < bacData.length; bi2++) {
    var d  = bacData[bi2];
    var bm = bacGroup.children[bi2];
    bm.position.set(
      d.ox + Math.sin(t * d.sp * 2.5 + d.ph) * .15,
      d.oy + Math.sin(t * d.sp * 1.8 + d.ph + 1) * .21,
      d.oz + Math.cos(t * d.sp * 2.0 + d.ph) * .13
    );
    bm.scale.setScalar(.84 + Math.sin(t * d.sp * 3 + d.ph) * .18);
  }
  matBac.emissiveIntensity = .28 + Math.sin(t * 2.2) * .13;

  /* Underground digester glow (organic gurgling) */
  digGlow.intensity = 2.8 + Math.sin(t * 1.75) * .55;

  /* Window + porch bulb warm pulse */
  matWinGlo.emissiveIntensity = 1.08 + Math.sin(t * 1.3) * .13;
  bulbGlow.intensity = 1.7 + Math.sin(t * .85) * .10;

  /* Generator LED */
  matLedG.emissiveIntensity = .82 + Math.sin(t * 4.5) * .42;

  /* Alternator spin */
  altMesh.rotation.z = t * 3.6;

  /* Cloud drift */
  for (var ci = 0; ci < clouds.length; ci++) {
    clouds[ci].position.x += .004 * (ci % 2 === 0 ? 1 : -1);
    if (clouds[ci].position.x > 30)  clouds[ci].position.x = -24;
    if (clouds[ci].position.x < -24) clouds[ci].position.x = 30;
  }

  /* Particles */
  var idx, p;
  for (idx = 0; idx < gpN; idx++) {
    gT[idx].t = (gT[idx].t + gT[idx].sp) % 1;
    p = greenPath(gT[idx].t);
    gp.pos[idx*3]   = p.x + (Math.random()-.5)*.06;
    gp.pos[idx*3+1] = p.y + (Math.random()-.5)*.06;
    gp.pos[idx*3+2] = p.z + gT[idx].jz;
  }
  gp.geo.attributes.position.needsUpdate = true;

  for (idx = 0; idx < ypN; idx++) {
    yT[idx].t = (yT[idx].t + yT[idx].sp) % 1;
    p = yellowPath(yT[idx].t);
    yp.pos[idx*3]   = p.x + (Math.random()-.5)*.06;
    yp.pos[idx*3+1] = p.y + (Math.random()-.5)*.06;
    yp.pos[idx*3+2] = p.z + yT[idx].jz;
  }
  yp.geo.attributes.position.needsUpdate = true;

  for (idx = 0; idx < wpN; idx++) {
    wT[idx].t = (wT[idx].t + wT[idx].sp) % 1;
    p = whitePath(wT[idx].t);
    wp.pos[idx*3]   = p.x + (Math.random()-.5)*.05;
    wp.pos[idx*3+1] = p.y + (Math.random()-.5)*.05;
    wp.pos[idx*3+2] = p.z + wT[idx].jz;
  }
  wp.geo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
