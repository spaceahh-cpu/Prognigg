<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"/>
<title>Sistema de Biogás — Colombia Rural</title>
<script src="https://unpkg.com/three@0.134.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://unpkg.com/three@0.134.0/examples/js/renderers/CSS2DRenderer.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#0a1628;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
#app{width:100vw;height:100vh;position:relative}
canvas{display:block}
.lbl{
  color:#fff;font-size:10px;font-weight:700;
  background:rgba(6,16,30,.78);
  padding:4px 11px;border-radius:20px;
  border:1px solid rgba(80,210,130,.45);
  pointer-events:none;white-space:nowrap;
  letter-spacing:.8px;text-transform:uppercase;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)
}
#hud{
  position:fixed;top:0;left:0;right:0;
  padding:14px 16px 28px;
  background:linear-gradient(to bottom,rgba(6,14,26,.9),transparent);
  pointer-events:none;z-index:200;text-align:center
}
#hud h1{font-size:18px;font-weight:700;color:#fff;
  text-shadow:0 0 22px rgba(80,210,130,.6);letter-spacing:.4px}
#hud h1 em{color:#50D282;font-style:normal}
#hud p{font-size:11px;color:rgba(255,255,255,.55);margin-top:5px;letter-spacing:.4px}
#hint{
  position:fixed;bottom:14px;right:14px;
  color:rgba(255,255,255,.4);font-size:10px;
  text-align:right;z-index:200;pointer-events:none;line-height:2;letter-spacing:.3px
}
#info{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
  width:min(520px,90vw);
  background:rgba(6,14,26,.93);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(80,210,130,.22);border-radius:16px;
  padding:18px 22px;
  box-shadow:0 24px 64px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.06);
  display:none;z-index:300
}
#info-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#info h3{color:#50D282;font-size:14px;font-weight:700;letter-spacing:.2px}
#info-close{
  background:rgba(80,210,130,.12);border:1px solid rgba(80,210,130,.3);
  color:#50D282;width:28px;height:28px;border-radius:50%;cursor:pointer;
  font-size:13px;display:flex;align-items:center;justify-content:center
}
#info p{font-size:12px;line-height:1.75;color:rgba(200,225,212,.9)}
#legend{
  position:fixed;top:76px;left:14px;z-index:200;
  background:rgba(6,14,26,.72);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.09);border-radius:12px;
  padding:11px 14px;pointer-events:none
}
#legend h4{color:rgba(255,255,255,.4);font-size:9px;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;margin-bottom:8px}
.lr{display:flex;align-items:center;gap:8px;margin:5px 0;
  font-size:10px;color:rgba(200,220,210,.85);letter-spacing:.2px}
.ld{width:8px;height:8px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>🌿 <em>Sistema de Biogás</em> — Energía para Colombia Rural</h1>
  <p>Residuos de ganado · Biodigestor · Bacterias metanogénicas · Electricidad limpia</p>
</div>
<div id="hint">✦ Arrastrar: rotar &nbsp;·&nbsp; Pellizcar: zoom<br>✦ Tocar componente: más información</div>
<div id="legend">
  <h4>Flujo de Energía</h4>
  <div class="lr"><div class="ld" style="background:#00ff88"></div>Residuos orgánicos</div>
  <div class="lr"><div class="ld" style="background:#ffcc00"></div>Gas metano CH₄</div>
  <div class="lr"><div class="ld" style="background:#88ccff"></div>Electricidad</div>
</div>
<div id="info">
  <div id="info-hdr">
    <h3 id="info-title"></h3>
    <button id="info-close" onclick="document.getElementById('info').style.display='none'">✕</button>
  </div>
  <p id="info-text"></p>
</div>

<script>
/* ── INFO DATA ───────────────────────────────────────────── */
var INFO = {
  COW:{ title:'🐄 Vaca — Fuente de Materia Orgánica',
    text:'Cada vaca produce 10–15 kg de estiércol diario, rico en materia orgánica y bacterias metanogénicas. La ganadería extensiva de Colombia convierte este residuo en un recurso energético renovable y abundante para comunidades rurales aisladas que no tienen acceso a la red eléctrica nacional.' },
  WASTE:{ title:'💩 Residuos de Ganado — Materia Prima',
    text:'El estiércol se mezcla con agua (proporción 1:1) formando el "biol", que se vierte al biodigestor. Contiene los microorganismos necesarios para la digestión anaerobia. El residuo digerido final es un fertilizante orgánico de alta calidad que mejora los suelos agrícolas locales.' },
  DIGESTER:{ title:'⚙️ Biodigestor Anaeróbico — El Corazón del Sistema',
    text:'Tanque hermético donde la materia orgánica se descompone sin oxígeno. Procesa 50–500 L de slurry por día según tamaño. La digestión tarda 15–40 días a 25–40 °C, temperaturas naturales en el clima tropical colombiano. Tipos comunes: tubular (plástico), cúpula fija (concreto) o globo (geomembrana).' },
  BACTERIA:{ title:'🦠 Bacterias Metanogénicas — Motor Biológico',
    text:'Arqueas metanogénicas (Methanobacterium, Methanosarcina) descomponen la materia orgánica y producen CH₄. Presentes naturalmente en el estiércol bovino, operan de forma óptima a 30–37 °C —condiciones que el clima colombiano ofrece de forma natural, eliminando la necesidad de calefacción artificial.' },
  METHANE:{ title:'💨 Metano CH₄ — Energía Capturada',
    text:'El biogás contiene 55–70 % de metano. Se acumula en la cúpula del biodigestor y fluye a presión constante al generador. Una vaca genera ~1 m³ de biogás/día, equivalente a 10 h de luz LED. La válvula roja controla el flujo y garantiza la seguridad del sistema ante sobrepresiones.' },
  GENERATOR:{ title:'⚡ Generador de Biogás — Conversión Energética',
    text:'Motor de combustión interna adaptado para metano, acoplado a un alternador que produce 110 V/60 Hz. Un generador de 2 kW abastece: 8–12 lámparas LED, nevera pequeña, carga de teléfonos y televisor. Eficiencia eléctrica: 25–30 %. El calor residual puede aprovecharse para cocción.' },
  CABLES:{ title:'🔌 Mini-Red Eléctrica — Distribución Local',
    text:'Red de baja tensión con postes de madera y conductores de cobre que distribuye electricidad a varias viviendas. Un sistema de 2–5 kW sirve 4–10 hogares rurales hasta 500 m. Incluye protecciones: fusibles, pararrayos y medidores por familia. Costo aproximado: USD 800–2 500.' },
  HOUSE:{ title:'🏠 Hogar Rural — Beneficiario Final',
    text:'Familias en comunidades aisladas de Colombia (Amazonía, Pacífico, Andes) sin acceso a la red eléctrica. Con biogás obtienen: iluminación nocturna segura, refrigeración para alimentos y medicinas, conectividad (carga de celulares) y acceso a educación digital. Se reducen enfermedades por humo de leña y se frena la deforestación.' }
};

/* ── SETUP ───────────────────────────────────────────────── */
function W(){ return window.innerWidth; }
function H(){ return window.innerHeight; }

var renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(W(), H());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputEncoding = THREE.sRGBEncoding;
document.getElementById('app').appendChild(renderer.domElement);

var labelRenderer = new THREE.CSS2DRenderer();
labelRenderer.setSize(W(), H());
labelRenderer.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;';
document.getElementById('app').appendChild(labelRenderer.domElement);

var scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x7ecce3, 0.012);

var camera = new THREE.PerspectiveCamera(52, W()/H(), 0.1, 200);
camera.position.set(1, 9, 23);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(1, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 5;
controls.maxDistance = 52;
controls.maxPolarAngle = Math.PI * 0.80;
controls.update();

/* ── SKY DOME (gradient shader) ─────────────────────────── */
scene.add(new THREE.Mesh(
  new THREE.SphereGeometry(95, 32, 16),
  new THREE.ShaderMaterial({
    uniforms:{
      top:   { value: new THREE.Color(0x0c1e3d) },
      mid:   { value: new THREE.Color(0x1a6faa) },
      horiz: { value: new THREE.Color(0x7ecce3) }
    },
    vertexShader:[
      'varying float vY;',
      'void main(){',
      '  vY=(modelMatrix*vec4(position,1.0)).y;',
      '  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);',
      '}'
    ].join('\n'),
    fragmentShader:[
      'uniform vec3 top,mid,horiz;',
      'varying float vY;',
      'void main(){',
      '  float t1=clamp(vY/16.0,0.0,1.0);',
      '  float t2=clamp(vY/85.0,0.0,1.0);',
      '  vec3 c=mix(horiz,mid,t1);',
      '  c=mix(c,top,t2);',
      '  gl_FragColor=vec4(c,1.0);',
      '}'
    ].join('\n'),
    side: THREE.BackSide
  })
));

/* ── LIGHTING ────────────────────────────────────────────── */
scene.add(new THREE.HemisphereLight(0x9DCFEA, 0x2E6B1A, 0.45));

var sun = new THREE.DirectionalLight(0xFFF5D8, 1.7);
sun.position.set(14, 22, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left   = -26;
sun.shadow.camera.right  =  26;
sun.shadow.camera.top    =  22;
sun.shadow.camera.bottom = -22;
sun.shadow.camera.near   = 1;
sun.shadow.camera.far    = 65;
sun.shadow.bias          = -0.0004;
scene.add(sun);

scene.add(Object.assign(new THREE.DirectionalLight(0x9EC5FF, 0.32), { position: new THREE.Vector3(-12, 8, -6) }));

var digGlow  = new THREE.PointLight(0xFF8822, 2.8, 11);
digGlow.position.set(-3.7, -1.5, 0);
scene.add(digGlow);

var genGlow  = new THREE.PointLight(0xAADDFF, 1.1, 6);
genGlow.position.set(1.0, 1.8, 0);
scene.add(genGlow);

var bulbGlow = new THREE.PointLight(0xFFCC44, 1.8, 5.5);
bulbGlow.position.set(11.5, 2.1, 2.5);
scene.add(bulbGlow);

/* ── PBR MATERIALS ───────────────────────────────────────── */
function std(o){ return new THREE.MeshStandardMaterial(o); }

var M = {
  grassA:   std({color:0x2E8B3A,roughness:.95,metalness:0}),
  grassB:   std({color:0x1E6B2A,roughness:.95,metalness:0}),
  soilA:    std({color:0x8B5E3C,roughness:.98,metalness:0}),
  soilB:    std({color:0x6B4030,roughness:.98,metalness:0}),
  soilC:    std({color:0x9B7050,roughness:.95,metalness:0}),
  rock:     std({color:0x524D5C,roughness:.95,metalness:.04}),
  clay:     std({color:0xA06040,roughness:.97,metalness:0}),
  steel:    std({color:0x99AABB,roughness:.28,metalness:.88}),
  dkSteel:  std({color:0x445566,roughness:.4, metalness:.8}),
  paintGray:std({color:0x5D6F80,roughness:.5, metalness:.3}),
  indus:    std({color:0x3C4F62,roughness:.5, metalness:.35}),
  brass:    std({color:0xCC9933,roughness:.28,metalness:.82}),
  copper:   std({color:0xCC7722,roughness:.33,metalness:.75}),
  galv:     std({color:0xBBCCDD,roughness:.22,metalness:.92}),
  rubber:   std({color:0x111111,roughness:.95,metalness:0}),
  concrete: std({color:0x888888,roughness:.9, metalness:0}),
  cowSkin:  std({color:0xEED8A8,roughness:.9, metalness:0}),
  cowSpot:  std({color:0x1A1A1A,roughness:.9, metalness:0}),
  cowPink:  std({color:0xF0A0A0,roughness:.8, metalness:0}),
  cowHoof:  std({color:0x1E1E1E,roughness:.85,metalness:.02}),
  cowHorn:  std({color:0xD4B880,roughness:.7, metalness:0}),
  waste:    std({color:0x6B3A1A,roughness:.99,metalness:0}),
  digTank:  std({color:0x455A6A,roughness:.42,metalness:.42}),
  digFlg:   std({color:0x556677,roughness:.28,metalness:.78}),
  liquid:   std({color:0x7A3D12,roughness:.18,metalness:0,transparent:true,opacity:.88}),
  bac:      std({color:0x22EE66,roughness:.5, metalness:0,emissive:new THREE.Color(0x005500),emissiveIntensity:.32}),
  pipe:     std({color:0x778899,roughness:.32,metalness:.82}),
  valve:    std({color:0xDD2200,roughness:.28,metalness:.62}),
  genFrame: std({color:0x28394E,roughness:.52,metalness:.32}),
  genEng:   std({color:0x3E4F62,roughness:.48,metalness:.42}),
  genAlt:   std({color:0xBB8800,roughness:.28,metalness:.72}),
  genPanel: std({color:0x0C1C2C,roughness:.48,metalness:.22}),
  genSkid:  std({color:0x18283A,roughness:.52,metalness:.52}),
  ledG:     std({color:0x00FF44,roughness:.3, metalness:0,emissive:new THREE.Color(0x00AA33),emissiveIntensity:1.0}),
  ledR:     std({color:0xFF2200,roughness:.3, metalness:0,emissive:new THREE.Color(0xAA1100),emissiveIntensity:.8}),
  wood:     std({color:0x9B6C1E,roughness:.92,metalness:0}),
  insulat:  std({color:0xAA3300,roughness:.62,metalness:.02}),
  wire:     std({color:0x1A1A1A,roughness:.62,metalness:.32}),
  stucco:   std({color:0xE8D5A8,roughness:.85,metalness:0}),
  roofZinc: std({color:0x889999,roughness:.45,metalness:.65}),
  doorWood: std({color:0x7A4010,roughness:.85,metalness:0}),
  winGlo:   std({color:0xFFEE88,roughness:.18,metalness:0,emissive:new THREE.Color(0xFF9900),emissiveIntensity:1.1}),
  winFrame: std({color:0x886633,roughness:.72,metalness:.1}),
  fence:    std({color:0xD4A864,roughness:.82,metalness:0}),
  bark:     std({color:0x7A5015,roughness:.92,metalness:0}),
  lvs1:     std({color:0x1A8A22,roughness:.9, metalness:0}),
  lvs2:     std({color:0x228B2A,roughness:.9, metalness:0}),
  lvs3:     std({color:0x30A830,roughness:.9, metalness:0}),
  hillA:    std({color:0x2A6A2A,roughness:.98,metalness:0}),
  hillB:    std({color:0x1A4A1A,roughness:.98,metalness:0}),
  hillC:    std({color:0x3A7A3A,roughness:.98,metalness:0}),
  cloud:    std({color:0xffffff,roughness:.8, metalness:0,transparent:true,opacity:.87})
};

/* ── HELPERS ─────────────────────────────────────────────── */
var clickables = [];
function hitbox(geo, x, y, z, id){
  var m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({transparent:true,opacity:0,side:THREE.DoubleSide,depthWrite:false}));
  m.position.set(x,y,z); m.userData.id = id;
  scene.add(m); clickables.push(m); return m;
}
function lbl(text, x, y, z){
  var d = document.createElement('div'); d.className='lbl'; d.textContent=text;
  var o = new THREE.CSS2DObject(d); o.position.set(x,y,z); scene.add(o); return o;
}
function box(w,h,d,mat,x,y,z,rx,ry,rz,cast){
  var m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);
  if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
  if(cast) m.castShadow=true;
  scene.add(m); return m;
}
function cyl(rt,rb,h,seg,mat,x,y,z,rx,ry,rz,cast){
  var m = new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg||12),mat);
  m.position.set(x,y,z);
  if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
  if(cast) m.castShadow=true;
  scene.add(m); return m;
}
function sph(r,mat,x,y,z,sx,sy,sz){
  var m = new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);
  m.position.set(x,y,z);
  if(sx||sy||sz) m.scale.set(sx||1,sy||1,sz||1);
  scene.add(m); return m;
}

/* ══════════════════════════════════════════════════════════
   TERRAIN
══════════════════════════════════════════════════════════ */
// Wide background
var bgGnd = new THREE.Mesh(new THREE.PlaneGeometry(180,120),M.grassB);
bgGnd.rotation.x = -Math.PI/2; bgGnd.position.y = -0.02;
bgGnd.receiveShadow = true; scene.add(bgGnd);

// Left grass slab
var lgnd = new THREE.Mesh(new THREE.PlaneGeometry(11.6,16),M.grassA);
lgnd.rotation.x = -Math.PI/2; lgnd.position.set(-12.2,0,0);
lgnd.receiveShadow=true; scene.add(lgnd);

// Right grass slab
var rgnd = new THREE.Mesh(new THREE.PlaneGeometry(21,16),M.grassA);
rgnd.rotation.x = -Math.PI/2; rgnd.position.set(9.5,0,0);
rgnd.receiveShadow=true; scene.add(rgnd);

// Concrete curb around underground pit
var cbMat = std({color:0x777777,roughness:.72,metalness:.12});
box(0.4,.38,8.2,cbMat,-7.0,.19,0);   // left curb
box(0.4,.38,8.2,cbMat,-0.2,.19,0);   // right curb
box(7.2,.38,0.4,cbMat,-3.6,.19,-3.8);// back curb
box(7.2,.38,0.4,cbMat,-3.6,.19, 3.8);// front curb

// Underground pit walls (no front face — camera sees inside)
// Back wall
var bwm = new THREE.Mesh(new THREE.PlaneGeometry(6.8,5.4),M.soilA);
bwm.position.set(-3.6,-2.7,-3.8); scene.add(bwm);

// Geology layers
var geo_layers=[
  {c:0x5c3a1a,y:-0.32,h:.38},{c:0x7a5a3a,y:-.92,h:.52},
  {c:0x8B5E3C,y:-1.7,h:.66},{c:0xA07050,y:-2.62,h:.78},
  {c:0x6B4030,y:-3.56,h:.78},{c:0x524D5C,y:-4.52,h:.72}
];
geo_layers.forEach(function(g){
  var lm=new THREE.Mesh(new THREE.PlaneGeometry(6.8,g.h),std({color:g.c,roughness:.98,metalness:0}));
  lm.position.set(-3.6,g.y,-3.77); scene.add(lm);
});

// Left pit wall
var lwm=new THREE.Mesh(new THREE.PlaneGeometry(7.8,5.4),M.soilB);
lwm.rotation.y=Math.PI/2; lwm.position.set(-7.0,-2.7,0); scene.add(lwm);
// Right pit wall
var rwm=new THREE.Mesh(new THREE.PlaneGeometry(7.8,5.4),M.soilB);
rwm.rotation.y=-Math.PI/2; rwm.position.set(-0.2,-2.7,0); scene.add(rwm);
// Floor
var flm=new THREE.Mesh(new THREE.PlaneGeometry(6.8,7.8),M.rock);
flm.rotation.x=-Math.PI/2; flm.position.set(-3.6,-5.3,0); scene.add(flm);
// Dark topsoil seam
box(6.8,.22,7.8,std({color:0x2d1005,roughness:.99,metalness:0}),-3.6,-0.11,0);

/* ══════════════════════════════════════════════════════════
   COW  (x = -10.5)
══════════════════════════════════════════════════════════ */
var cowG = new THREE.Group();
function ca(geo,mat,x,y,z,rx,ry,rz,cast){
  var m=new THREE.Mesh(geo,mat); m.position.set(x,y,z);
  if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
  if(cast) m.castShadow=true; cowG.add(m); return m;
}

// Belly cylinder
ca(new THREE.CylinderGeometry(.55,.55,2.65,14),M.cowSkin, 0,.88,0, Math.PI/2,0,0);
// Body top
ca(new THREE.BoxGeometry(1.88,1.12,2.9),M.cowSkin, 0,1.22,0, 0,0,0,true);
// Spots
ca(new THREE.BoxGeometry(.72,.07,1.08),M.cowSpot, -.38,1.3,.42);
ca(new THREE.BoxGeometry(.56,.07,.92),M.cowSpot,   .32,1.3,-.62);
ca(new THREE.BoxGeometry(.48,.07,.7), M.cowSpot,  -.18,1.3,-1.1);
// Neck
ca(new THREE.CylinderGeometry(.32,.42,.68,10),M.cowSkin, 0,1.66,1.32, -.38,0,0);
// Head box + rounding
ca(new THREE.BoxGeometry(.95,.88,.94),M.cowSkin, 0,1.92,1.68, 0,0,0,true);
ca(new THREE.SphereGeometry(.43,12,9),M.cowSkin, 0,1.9,2.1);
// Snout
ca(new THREE.CylinderGeometry(.28,.3,.22,12),M.cowPink, 0,1.73,2.18, Math.PI/2,0,0);
// Nostrils
ca(new THREE.SphereGeometry(.04,6,4),std({color:0x662222,roughness:.85,metalness:0}), -.1,1.73,2.3);
ca(new THREE.SphereGeometry(.04,6,4),std({color:0x662222,roughness:.85,metalness:0}),  .1,1.73,2.3);
// Horns
ca(new THREE.CylinderGeometry(.04,.015,.54,7),M.cowHorn, -.38,2.44,1.56, .12,0,.45);
ca(new THREE.CylinderGeometry(.04,.015,.54,7),M.cowHorn,  .38,2.44,1.56, .12,0,-.45);
// Ears
function ear(sx){
  var e=new THREE.Mesh(new THREE.SphereGeometry(.2,9,7),M.cowSkin);
  e.scale.set(1,.56,1.2); e.position.set(sx,2.0,1.56); e.rotation.z=sx<0?.2:-.2; cowG.add(e);
  var i=new THREE.Mesh(new THREE.SphereGeometry(.12,9,7),M.cowPink);

function greenPath(t){
  if(t<.15) return new THREE.Vector3(-8.4,-t/.15*.28,0);
  if(t<.36){var s=(t-.15)/.21; return new THREE.Vector3(-8.4,-.28-s*3.54,0);}
  var s=(t-.36)/.64; return new THREE.Vector3(-8.4+s*4.7,-3.82,0);
}
function yellowPath(t){
  if(t<.5){var s=t/.5; return new THREE.Vector3(-3.7,-4.0+s*4.22,Math.sin(s*Math.PI*.5)*.32);}
  var s=(t-.5)/.5; return new THREE.Vector3(-3.7+s*4.78,.14,0);
}
function whitePath(t){
  var pts=[
    new THREE.Vector3(2.1,1.1,0),new THREE.Vector3(3.4,2.6,0),
    new THREE.Vector3(4.4,4.82,0),new THREE.Vector3(5.9,4.58,0),
    new THREE.Vector3(7.4,4.82,0),new THREE.Vector3(8.8,4.0,0),
    new THREE.Vector3(10.0,3.2,0),new THREE.Vector3(11.4,1.7,0)
  ];
  var tot=pts.length-1, sc=t*tot, idx=Math.min(Math.floor(sc),tot-1);
  return pts[idx].clone().lerp(pts[idx+1],sc-idx);
}
function mkPts(n,color,size){
  var pos=new Float32Array(n*3);
  var geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  var mat=new THREE.PointsMaterial({color:color,size:size,transparent:true,opacity:.82,
    sizeAttenuation:true,depthWrite:false,blending:THREE.AdditiveBlending});
  var p=new THREE.Points(geo,mat); scene.add(p);
  return {p:p,pos:pos,geo:geo};
}

  md.set(cx,cy);
}
function onUp(e){
  var cx=e.clientX!==undefined?e.clientX:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientX:0);
  var cy=e.clientY!==undefined?e.clientY:(e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientY:0);
  if(Math.abs(cx-md.x)>9||Math.abs(cy-md.y)>9) return;
  ms.set((cx/W())*2-1,-(cy/H())*2+1);
  ray.setFromCamera(ms,camera);
  var hits=ray.intersectObjects(clickables,false);
  if(!hits.length) return;
  var id=hits[0].object.userData.id;
  if(!INFO[id]) return;
  document.getElementById('info-title').textContent=INFO[id].title;
  document.getElementById('info-text').textContent=INFO[id].text;
  document.getElementById('info').style.display='block';
}
renderer.domElement.addEventListener('pointerdown',onDn);
renderer.domElement.addEventListener('pointerup',onUp);
renderer.domElement.addEventListener('touchstart',onDn,{passive:true});
renderer.domElement.addEventListener('touchend',onUp,{passive:true});

window.addEventListener('resize',function(){
  camera.aspect=W()/H();
  camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
  labelRenderer.setSize(W(),H());
});

/* ══════════════════════════════════════════════════════════
   ANIMATE
══════════════════════════════════════════════════════════ */
var clk=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  var t=clk.getElapsedTime();
  controls.update();

  // Bacteria pulse + bob
  bacD.forEach(function(d,i){
    var b=bacG.children[i];
    b.position.set(
      d.ox+Math.sin(t*d.sp*2.5+d.ph)*.15,
      d.oy+Math.sin(t*d.sp*1.8+d.ph+1)*.21,
      d.oz+Math.cos(t*d.sp*2+d.ph)*.13
    );
    b.scale.setScalar(.84+Math.sin(t*d.sp*3+d.ph)*.18);
  });
  M.bac.emissiveIntensity=.28+Math.sin(t*2.2)*.13;

  // Organic underground glow (gurgling)
  digGlow.intensity=2.6+Math.sin(t*1.75)*.55;

  // Window + bulb warm pulse
  M.winGlo.emissiveIntensity=1.08+Math.sin(t*1.3)*.13;
  bulbGlow.intensity=1.7+Math.sin(t*.85)*.1;

  // Generator LED blink
  M.ledG.emissiveIntensity=.82+Math.sin(t*4.5)*.42;

  // Alternator spin
  altMesh.rotation.z=t*3.6;

  // Cloud drift
  clouds.forEach(function(c,i){
    c.position.x+=.0042*(i%2===0?1:-1);
    if(c.position.x>30) c.position.x=-24;
    if(c.position.x<-24) c.position.x=30;
  });

  // Particles
  var p,idx;
  for(idx=0;idx<85;idx++){
    gT[idx].t=(gT[idx].t+gT[idx].sp)%1;
    p=greenPath(gT[idx].t);
    gp.pos[idx*3]=p.x+(Math.random()-.5)*.06;
    gp.pos[idx*3+1]=p.y+(Math.random()-.5)*.06;
    gp.pos[idx*3+2]=p.z+gT[idx].jz;
  }
  gp.geo.attributes.position.needsUpdate=true;

  for(idx=0;idx<72;idx++){
    yT[idx].t=(yT[idx].t+yT[idx].sp)%1;
    p=yellowPath(yT[idx].t);
    yp.pos[idx*3]=p.x+(Math.random()-.5)*.06;
    yp.pos[idx*3+1]=p.y+(Math.random()-.5)*.06;
    yp.pos[idx*3+2]=p.z+yT[idx].jz;
  }
  yp.geo.attributes.position.needsUpdate=true;

  for(idx=0;idx<90;idx++){
    wT[idx].t=(wT[idx].t+wT[idx].sp)%1;
    p=whitePath(wT[idx].t);
    wp.pos[idx*3]=p.x+(Math.random()-.5)*.05;
    wp.pos[idx*3+1]=p.y+(Math.random()-.5)*.05;
    wp.pos[idx*3+2]=p.z+wT[idx].jz;
  }
  wp.geo.attributes.position.needsUpdate=true;

  renderer.render(scene,camera);
  labelRenderer.render(scene,camera);
}
animate();
</script>
